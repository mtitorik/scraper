name: Build and Release Standalone App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            artifact_name: Scraper-macOS-arm64.dmg
          - os: macos-13
            arch: x64
            artifact_name: Scraper-macOS-x64.dmg
          - os: windows-latest
            arch: x64
            artifact_name: Scraper-Windows-x64.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          pytest -v tests/

      - name: Build macOS App
        if: runner.os == 'macOS'
        run: |
          pyinstaller --clean -y packaging/scraper_macos.spec
          cd dist
          hdiutil create -volname "Scraper" -srcfolder "Scraper.app" -ov -format UDZO "${{ matrix.artifact_name }}"

      - name: Build Windows App
        if: runner.os == 'Windows'
        run: |
          pyinstaller --clean -y packaging/scraper_windows.spec
          cd dist
          powershell Compress-Archive -Path Scraper -DestinationPath "${{ matrix.artifact_name }}" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
